# The site's prose, checked. The rules are styles/Eddy, copied from
# sluice's, which take the voice of agentplot/blueprints'
# books/VOICE.md; `prose` from the devenv shell runs them over
# site/src/content/docs. Plain words, the actor as the subject, nothing
# sold.
StylesPath = styles
Vocab = Eddy
MinAlertLevel = suggestion

[*.{md,mdx}]
BasedOnStyles = Vale, Eddy
Vale.Spelling = NO
# Starlight's directives, import lines and component tags are not prose.
TokenIgnores = (:::[a-z]+(?:\[[^\]]*\])?), (^import .*$), (<[A-Z][^>]*>)
