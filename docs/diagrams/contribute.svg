<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-labelledby="ed-contribute-w-ttl ed-contribute-w-dsc">
<title id="ed-contribute-w-ttl">Anyone can add a meeting service: a part counts once it passes the meeting checks</title>
<desc id="ed-contribute-w-dsc">Three parts wait to be checked: eddy's own webex part, your plugin's part, and another plugin's part. The meeting checks in the conformance pack test each in turn: its key is meeting slash service slash meeting id; event_at is when the meeting started; the raw files are the transcript as served plus one line per turn; it skips a meeting too short to matter; it carries no excerpt. webex and your part pass and join the plugin index beside eddy's wispr. The other part stamps event_at with the capture time, fails, and is not listed. For the long tail, a generic MCP part lists meetings from any MCP endpoint that serves transcripts, and millpond's folder drop takes any file dropped in a folder as one capture.</desc>
