<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-labelledby="ed-parts-w-ttl ed-parts-w-dsc">
<title id="ed-parts-w-ttl">eddy's parts share everything but the service</title>
<desc id="ed-parts-w-dsc">Three parts, wispr, webex and teams. Each part's own code lists its service's meetings since its cursor and fetches each transcript: Wispr Flow's MCP endpoint, Webex's transcripts API, and Microsoft Graph's meeting transcripts. Each fetched transcript then passes through the code every part shares: it reads the meeting's title, start, length and attendees, skips a meeting too short to matter, keys the meeting as meeting slash service slash id, and writes the transcript as served plus a plain copy with one line per turn. The three captures come out the same shape; only the service in the key differs.</desc>
