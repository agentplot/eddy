.ed-disk-w-aedge{fill:none;stroke:var(--accent);stroke-width:2}
.ed-disk-w-dash{stroke-dasharray:4 4}
.ed-disk-w-slot{fill:none;stroke:var(--rule);stroke-width:1.5;stroke-dasharray:5 4}
.ed-disk-w-tick{fill:none;stroke:var(--ok);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ed-disk-w-cross{fill:none;stroke:var(--bad);stroke-width:2.2;stroke-linecap:round}
.ed-disk-w-ring{fill:var(--panel);stroke:var(--rule);stroke-width:1.2}
.ed-disk-w-file{fill:var(--panel);stroke:var(--muted);stroke-width:1}
