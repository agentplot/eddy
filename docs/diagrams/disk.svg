<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-labelledby="ed-disk-w-ttl ed-disk-w-dsc">
<title id="ed-disk-w-ttl">What a meeting becomes: two raw files on the host and one capture line</title>
<desc id="ed-disk-w-dsc">The transcript as the service served it: timed segments, each with a speaker and a few words. eddy writes it whole as transcript.json, then joins each speaker's consecutive segments into a plain copy, transcript.txt, with one line per turn: Ana, so the export ships Friday; Raj, legal needs a week first; Ana, then the 24th; Mei, I'll tell the customer. Then one capture line describes the meeting: its key meeting slash wispr slash 7f3c2a, source meeting, event_at when the meeting started, its title, the two raw files, and no excerpt, since a reader reads it. The two files stay on the host and never enter git; millpond writes the line into the inbox.</desc>
<style>:root{--bg:#ebe9e2;--panel:#fbfaf7;--fg:#0e1116;--muted:#5d6370;--rule:#d0cdc3;--soft:#e0ddd4;--accent:#6b4fd8;--accent-soft:#e4ddfb;--ok:#1f8a4c;--bad:#c0392b;--ink:#fbfaf7}@media (prefers-color-scheme:dark){:root{--bg:#14181f;--panel:#1b2029;--fg:#f2f1ec;--muted:#9a9fab;--rule:#2f3540;--soft:#232933;--accent:#a68cff;--accent-soft:#2c2547;--ok:#45c27a;--bad:#f08a7e;--ink:#14181f}}
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:var(--fg)}
.ed-disk-w-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
