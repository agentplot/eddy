.ed-disk-w-ah{fill:var(--accent)}
.ed-disk-w-pulse{transform-box:fill-box;transform-origin:center}
.ed-disk-w-draw{stroke-dasharray:100}
.ed-disk-w-ghost{opacity:.5}
