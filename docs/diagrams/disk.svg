<text class="ed-disk-w-hd" x="324" y="72">ONE LINE PER TURN · transcript.txt</text>
<text class="ed-disk-w-mono ed-disk-w-f12 ed-disk-w-b ed-disk-w-s8" x="324" y="118">Ana:</text>
<text class="ed-disk-w-mono ed-disk-w-f12 ed-disk-w-b ed-disk-w-s9" x="324" y="162">Raj:</text>
<text class="ed-disk-w-mono ed-disk-w-f12 ed-disk-w-b ed-disk-w-s10" x="324" y="206">Ana:</text>
