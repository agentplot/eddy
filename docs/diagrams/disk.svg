<text class="ed-disk-w-mono ed-disk-w-f12 ed-disk-w-f12" x="360" y="118">so the export</text>
<text class="ed-disk-w-mono ed-disk-w-f12 ed-disk-w-f13" x="460.8" y="118">ships Friday</text>
<text class="ed-disk-w-mono ed-disk-w-f12 ed-disk-w-f14" x="360" y="162">legal needs</text>
