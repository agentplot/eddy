<text class="ed-disk-w-badget" x="32" y="446" text-anchor="middle">1</text>
<text class="ed-disk-w-t ed-disk-w-sm" x="50" y="438">eddy writes the transcript</text>
<text class="ed-disk-w-t ed-disk-w-sm" x="50" y="455">as the service served it,</text>
</g>
<g class="ed-disk-w-cap ed-disk-w-cap31">
<circle class="ed-disk-w-badge" cx="252" cy="442" r="11"/>
<text class="ed-disk-w-badget" x="252" y="446" text-anchor="middle">2</text>
